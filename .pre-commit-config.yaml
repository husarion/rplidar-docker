# Run locally:  pre-commit install   (one-time, sets up the git hook)
# Or manually:  pre-commit run --all-files
# CI mirrors this via .github/workflows/ci.yaml.

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: '^(\.github/workflows/.*\.yaml|husarion_utils/.*\.yaml|demo/.*\.yaml)$'
        args:
          - '-d'
          - '{extends: default, rules: {line-length: {max: 140}, document-start: disable, truthy: {check-keys: false}, comments-indentation: disable}}'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Preserve trailing spaces inside *.md (Markdown line breaks).
        exclude: '\.md$'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
